# Suggested: smooth 3D evasion. A Lissajous 1:2:3 makes the range (x, 2 per lap), the bearing
# (y, 1 per lap) and the elevation (z, 3 per lap) change together, so each factor of the study
# is exercised: heading (bearing rate), gimbal (elevation) and standoff (range). 160 m lap.
name: lissajous3d
description: 3D Lissajous (160 m) (range 2x, bearing 1x, altitude 3x per lap) centred 10 m ahead of the pursuer
duration: 0                  # until the lap is complete
target:
  start: [10, 0, 12]
  path:
  - trajectory: evade
    loops: 1
pursuer:
  start: [0, 0, 12]
  detection: vision
  acquisition: auto
  start_after: 0
trajectories:
  evade:
    type: lissajous
    center: [10, 0, 12]
    size: [10, 25, 6]
    frequency: [2, 1, 3]
    speed: 2.5
