# One run for the monograph pictures (Isaac Sim): figure 8 at 3 m/s, PAMPC with gimbal, 7 m.
#   aero study scenarios/studies/fotos_isaac.yaml --sims isaac
name: fotos_isaac
repetitions: 1
scenarios:
  - yaw_camera_speed/figure8.yaml

# Fixed in every run (the GCS remembers values changed by hand: everything compared is set here).
common:
  pursuer: {detection: vision, acquisition: auto, start_after: 0}   # chase from the first instant
  target: {max_speed: 12.0}           # executor cap (default 6 m/s); the X4 itself: 10 m/s, 8 m/s²
  parameters:
    /pursuit_controller_node:
      max_vel: 12.0                   # pursuer speed limit [m/s] (PX4 MPC_XY_VEL_MAX = 12)
      mpc.params.ref_horizontal: 1.0  # planar standoff: same altitude as the target
      mpc.params.N: 50.0              # 2.5 s horizon (variant N50_dt50, compiled once and cached)
      mpc.params.dt: 0.05
      mpc.params.q_px: 10.0
      mpc.params.q_py: 10.0
      mpc.params.q_pz: 10.0
      mpc.params.q_vx: 1.0
      mpc.params.q_vy: 1.0
      mpc.params.q_vz: 1.0
      mpc.params.r_ax: 0.5
      mpc.params.r_ay: 0.5
      mpc.params.r_az: 0.5
      mpc.params.q_f: 5.0
      mpc.params.a_max_xy: 8.0        # [m/s²] = X4 (39 deg tilt; x500 thrust/weight ~1.7)
      mpc.params.a_max_z: 4.0         # climbing 4 m/s² still fits beside 8 m/s² horizontal
      mpc.params.q_psi: 5.0 
      mpc.params.r_r: 0.5
      mpc.params.r_max: 1.2
    /gimbal:
      pitch_deg: 0.0                  # fixed camera angle (and where the gimbal returns when lost)
      max_rate_deg: 90.0

axes:
  yaw:
    - {name: pampc, parameters: {/pursuit_controller_node: {mpc.params.yaw_mode: 3.0}}}
  camera:
    - {name: track, parameters: {/gimbal: {auto_pitch: true}}}
  speed:
    - {name: v3, target_speed: 3.0}
  distance:
    - {name: d7, parameters: {/pursuit_controller_node: {target_distance: 7.0}}}
