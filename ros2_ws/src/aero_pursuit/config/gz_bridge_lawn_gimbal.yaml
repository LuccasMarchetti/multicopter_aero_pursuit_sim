# Pitch gimbal of x500_gimbal_depth (inserted as x500_depth_0 with AERO_CAMERA_MOUNT=gimbal):
# measured joints and the pitch command over ROS (gimbal_node). Loaded only with camera_mount:=gimbal.

- ros_topic_name: "/gimbal/joint_states"
  gz_topic_name: "/world/lawn/model/x500_depth_0/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/gimbal/cmd/pitch"
  gz_topic_name: "/model/x500_depth_0/gimbal/pitch"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
